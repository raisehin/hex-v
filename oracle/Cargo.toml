[package]
name = "hex-v-oracle"
version = "0.0.1"
edition = "2021"

# Verbatim copies of hex 3.4.0's Dot scope simulation:
#   src/rune_hud/{dot_scope.rs, dot_scope/scope.rs, spring.rs, hud_placement.rs}
#   src/dictation/indicator.rs
# The hex binary cannot be built here (no network; the pinned transcribe.cpp
# revision is not in the cargo cache), so this crate compiles the same sources
# on their own to produce the u16 dot oracle.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = { path = "shim/color-eyre" }
tracing = "0.1"
